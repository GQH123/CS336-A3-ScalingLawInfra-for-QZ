[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaling-laws-backend"
version = "0.1.0"
description = "Backend API and provider adapters for the scaling-laws course assignment."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100",
  "requests>=2.28",
  "uvicorn>=0.23"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.24",
  "pytest>=8"
]

[project.scripts]
scaling-generate-api-tokens = "scaling_backend.generate_api_tokens:main"

[tool.setuptools.packages.find]
include = ["scaling_backend*"]
