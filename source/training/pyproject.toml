[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaling-laws-course-trainer"
version = "0.1.0"
description = "Compute-node trainer adapter that runs frozen scaling-law manifests with the Stanford CS336 training backend."
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[tool.setuptools.packages.find]
include = ["course_trainer*"]
